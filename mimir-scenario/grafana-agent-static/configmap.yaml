# configmap.yaml
# Grafana Agent Static mode – alternative to the Operator for scraping metrics
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-agent-static
  namespace: default
data:
  agent.yaml: |
    metrics:
      global:
        scrape_interval: 60s
        external_labels:
          cluster: my-cluster
      wal_directory: /tmp/grafana-agent-wal
      configs:
        - name: default
          scrape_configs:
            # kubelet metrics
            - job_name: kubelet
              scheme: https
              tls_config:
                insecure_skip_verify: true
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - target_label: __address__
                  replacement: kubernetes.default.svc:443
                - source_labels: [__meta_kubernetes_node_name]
                  regex: (.+)
                  target_label: __metrics_path__
                  replacement: /api/v1/nodes/${1}/proxy/metrics

            # cAdvisor metrics
            - job_name: cadvisor
              scheme: https
              tls_config:
                insecure_skip_verify: true
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - target_label: __address__
                  replacement: kubernetes.default.svc:443
                - source_labels: [__meta_kubernetes_node_name]
                  regex: (.+)
                  target_label: __metrics_path__
                  replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

          remote_write:
            - url: http://mimir-nginx.mimir.svc.cluster.local/api/v1/push
              headers:
                X-Scope-OrgID: anonymous

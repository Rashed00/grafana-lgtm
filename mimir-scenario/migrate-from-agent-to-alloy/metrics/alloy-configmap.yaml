# alloy-configmap.yaml
# Alloy configuration – replaces Grafana Agent for metrics collection
# Scrapes kubelet and cAdvisor, remote_writes to Mimir
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-metrics-config
  namespace: alloy-metrics
data:
  config.alloy: |
    // ── Kubernetes node discovery ─────────────────────────────────────────────
    discovery.kubernetes "nodes" {
      role = "node"
    }

    // ── Relabeling for kubelet metrics ────────────────────────────────────────
    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.nodes.targets

      rule {
        target_label = "__address__"
        replacement  = "kubernetes.default.svc.cluster.local:443"
      }

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = "(.+)"
        target_label  = "__metrics_path__"
        replacement   = "/api/v1/nodes/${1}/proxy/metrics"
      }

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
    }

    // ── Relabeling for cAdvisor metrics ───────────────────────────────────────
    discovery.relabel "cadvisor" {
      targets = discovery.kubernetes.nodes.targets

      rule {
        target_label = "__address__"
        replacement  = "kubernetes.default.svc.cluster.local:443"
      }

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = "(.+)"
        target_label  = "__metrics_path__"
        replacement   = "/api/v1/nodes/${1}/proxy/metrics/cadvisor"
      }

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
    }

    // ── Scrape kubelet ────────────────────────────────────────────────────────
    prometheus.scrape "kubelet" {
      targets    = discovery.relabel.kubelet.output
      forward_to = [prometheus.remote_write.mimir.receiver]

      scheme                 = "https"
      bearer_token_file      = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      scrape_interval        = "60s"

      tls_config {
        insecure_skip_verify = true
      }
    }

    // ── Scrape cAdvisor ───────────────────────────────────────────────────────
    prometheus.scrape "cadvisor" {
      targets    = discovery.relabel.cadvisor.output
      forward_to = [prometheus.remote_write.mimir.receiver]

      scheme                 = "https"
      bearer_token_file      = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      scrape_interval        = "60s"

      tls_config {
        insecure_skip_verify = true
      }
    }

    // ── Remote write to Mimir ─────────────────────────────────────────────────
    prometheus.remote_write "mimir" {
      endpoint {
        url = "http://mimir-nginx.mimir.svc.cluster.local/api/v1/push"

        headers = {
          "X-Scope-OrgID" = "anonymous",
        }
      }

      external_labels = {
        cluster = "my-cluster",
      }
    }

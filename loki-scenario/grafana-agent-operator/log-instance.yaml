# log-instance.yaml
# LogsInstance – defines where to ship logs (remote_write to Loki)
apiVersion: monitoring.grafana.com/v1alpha1
kind: LogsInstance
metadata:
  name: primary
  namespace: default
  labels:
    agent: grafana-agent-logs
spec:
  clients:
    - url: http://loki.loki.svc.cluster.local:3100/loki/api/v1/push
      externalLabels:
        cluster: my-cluster
  podLogsNamespaceSelector: {}
  podLogsSelector:
    matchLabels:
      instance: primary
